name: Deploy Azure Function

on:
  push:
    branches: [master]
    paths:
      - 'azure-function/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: azure-function
        run: npm install --omit=dev

      - name: Zip package
        run: |
          cd azure-function
          zip -r ../function.zip . -x "*.git*"

      - name: Deploy via zip deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          SCM_URL=$(echo "$PUBLISH_PROFILE" | grep -oP 'publishUrl="[^"]+"' | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          USER=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\$[^"]+"' | head -1 | grep -oP '"\$[^"]+"' | tr -d '"')
          PASS=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="[^"]+"' | head -1 | grep -oP '"[^"]+"' | tr -d '"')
          curl -X POST "https://${SCM_URL}/api/zipdeploy" \
            -u "${USER}:${PASS}" \
            --data-binary @function.zip \
            -H "Content-Type: application/zip" \
            -w "\nHTTP Status: %{http_code}\n" \
            --fail
