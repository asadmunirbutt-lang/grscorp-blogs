name: Deploy Azure Function

on:
  push:
    branches: [master]
    paths:
      - 'azure-function/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: azure-function
        run: npm install --omit=dev

      - name: Zip package
        run: |
          cd azure-function
          zip -r ../function.zip . -x "*.git*"

      - name: Deploy via zip deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET, os, sys, base64
          from urllib.request import urlopen, Request
          from urllib.error import HTTPError

          profile = os.environ['PUBLISH_PROFILE']
          root = ET.fromstring(profile)
          scm_url = user = pwd = None
          for p in root.findall('publishProfile'):
              if p.get('publishMethod') == 'ZipDeploy':
                  scm_url = p.get('publishUrl').split(':')[0]
                  user = p.get('userName')
                  pwd = p.get('userPWD')
                  break

          if not all([scm_url, user, pwd]):
              print("ERROR: Could not extract ZipDeploy credentials from publish profile")
              sys.exit(1)

          print(f"Deploying to: https://{scm_url}/api/zipdeploy")
          print(f"User: {user[:4]}****")

          auth = base64.b64encode(f"{user}:{pwd}".encode()).decode()
          with open('function.zip', 'rb') as f:
              data = f.read()
          print(f"Zip size: {len(data)} bytes")

          url = f"https://{scm_url}/api/zipdeploy"
          req = Request(url, data=data, headers={
              'Authorization': f'Basic {auth}',
              'Content-Type': 'application/zip'
          }, method='POST')
          try:
              resp = urlopen(req)
              print(f"Deploy succeeded: HTTP {resp.status}")
          except HTTPError as e:
              body = e.read().decode()
              print(f"Deploy failed: HTTP {e.code}\n{body}")
              sys.exit(1)
          PYEOF
